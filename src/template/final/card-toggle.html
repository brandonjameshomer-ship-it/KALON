<div style="position: absolute; left: 14px; top: 76px; z-index: 9; opacity: {{tgOp}}; visibility: {{tgVis}}; transition: opacity 1.2s ease">
<button type="button" class="hs-ghost" onClick="{{toggleCard}}" aria-label="{{tgLabel}}" title="{{tgLabel}}" aria-pressed="{{tgPressed}}" style="width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 12px; background: rgba(255, 250, 243, 0.7); color: #2f2c27; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="display: block"><path d="{{tgIcon}}" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"></path></svg>
</button>
</div>
