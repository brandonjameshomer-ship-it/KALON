<div style="padding: 22px 26px 18px; display: flex; flex-direction: column; gap: 6px; background: {{softAccent}}; border-bottom: 1px solid #e4dfd5">
<span style="font-size: 15px; font-weight: 600; color: #4a463f">{{dpTitle}}</span>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<label style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
<input type="text" ref="{{dpHeadRef}}" onFocus="{{dpHeadFocus}}" value="{{dpHeadText}}" onChange="{{dpOnHead}}" placeholder="MM/DD/YYYY" inputmode="numeric" autocomplete="off" aria-label="{{dpTitle}}, as month, day and year" style="width: 100%; height: 60px; box-sizing: border-box; padding: 0 14px; border: 2px solid {{accent}}; border-radius: 12px; background: #ffffff; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; font-weight: 600; letter-spacing: 0.02em; color: #1e1c19">
<span aria-live="polite" style="font-size: 15px; color: #4a463f; opacity: {{dpHeadOp}}">{{dpHeadline}}</span>
<span role="alert" style="display: {{dpErrDisp}}; font-size: 15px; color: #9a2f22">{{dpErr}}</span>
</label>
</div>
</div>
