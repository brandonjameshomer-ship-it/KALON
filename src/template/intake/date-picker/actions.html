<div style="padding: 10px 16px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
<button type="button" onClick="{{dpClear}}" style="height: 48px; padding: 0 16px; border: 0; border-radius: 24px; background: transparent; color: #5d584f; font-size: 17px; font-weight: 600; cursor: pointer">Clear</button>
<div style="display: flex; gap: 6px">
<button type="button" onClick="{{dpCancel}}" style="height: 48px; padding: 0 18px; border: 0; border-radius: 24px; background: transparent; color: {{accent}}; font-size: 17px; font-weight: 600; cursor: pointer">Cancel</button>
<button type="button" onClick="{{dpOk}}" style="height: 48px; padding: 0 24px; border: 0; border-radius: 24px; background: {{accent}}; color: #ffffff; font-size: 17px; font-weight: 600; opacity: {{dpOkOp}}; cursor: pointer">OK</button>
</div>
</div>
