<sc-if value="{{wIs_faith}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{faithCards}}" as="fc" hint-placeholder-count="9">
<button type="button" onClick="{{fc.pick}}" aria-pressed="{{fc.pressed}}" style="min-height: 116px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border: 2px solid {{fc.bd}}; border-radius: 14px; background: {{fc.bg}}; color: #1e1c19; cursor: pointer">
<svg viewBox="0 0 100 100" width="44" height="44" aria-hidden="true" style="display: {{fc.svgDisp}}"><path d="{{fc.d}}" style="fill: {{fc.fill}}; stroke: {{fc.stroke}}; stroke-width: {{fc.sw}}; fill-rule: evenodd; stroke-linecap: round; stroke-linejoin: round"></path></svg>
<span style="font-size: 18px; font-weight: 600; line-height: 1.2; text-align: center">{{fc.label}}</span>
</button>
</sc-for>
</div>
<sc-if value="{{faithOtherOn}}" hint-placeholder-val="{{false}}">
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 18px; font-weight: 600">Which faith or symbol?</span>
<input class="hs-big" type="text" value="{{fFaithOther}}" onChange="{{onFaithOther}}" placeholder="For example: Latter-day Saint, Orthodox, Sikh" style="height: 60px; box-sizing: border-box; padding: 0 18px; border: 2px solid #cfc9bd; border-radius: 12px; background: #ffffff; font-size: 21px; color: #1e1c19">
</label>
<div aria-live="polite" style="display: {{faithGuessDisp}}; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #f4efe4; border: 1px solid #e0d6c2">
<svg viewBox="0 0 100 100" width="36" height="36" aria-hidden="true" style="display: {{faithGuessSymDisp}}; flex: none"><path d="{{faithGuessD}}" style="fill: {{faithGuessFill}}; stroke: {{faithGuessStroke}}; stroke-width: {{faithGuessSw}}; fill-rule: evenodd; stroke-linecap: round; stroke-linejoin: round"></path></svg>
<span style="font-size: 17px; line-height: 1.4; color: #3d3a34">{{faithGuessText}}</span>
</div>
</sc-if>
</div>
</sc-if>
