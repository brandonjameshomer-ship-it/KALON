<div style="position: relative; width: 380px; height: 290px; flex-shrink: 0; align-self: center">
<div aria-hidden="true" style="position: absolute; left: -36px; top: -54px; width: 440px; height: 330px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 226, 180, 0.45), rgba(255, 226, 180, 0) 100%); animation: hsGlow 7s ease-in-out infinite; pointer-events: none"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 380px; height: 290px; border-radius: 12px; background: linear-gradient(180deg, #dcd8d1 0%, #cdc9c2 100%); -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%), linear-gradient(180deg, transparent 0, #000 7%, #000 93%, transparent 100%); -webkit-mask-composite: source-in; mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%), linear-gradient(180deg, transparent 0, #000 7%, #000 93%, transparent 100%); mask-composite: intersect"></div>
<div style="position: absolute; left: 0; top: 0; width: 380px; height: 290px; box-sizing: border-box; padding: 34px 38px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center">
<svg viewBox="0 0 100 100" width="42" height="42" aria-hidden="true" style="display: {{pvSymDisp}}; flex-shrink: 0; opacity: {{pvSymOp}}; transition: opacity .6s ease"><path d="{{pvSymD}}" style="fill: {{pvSymFill}}; stroke: {{pvSymStroke}}; stroke-width: {{pvSymSw}}; fill-rule: evenodd; stroke-linecap: round; stroke-linejoin: round"></path></svg>
<span style="font-family: 'Cinzel', Georgia, serif; font-size: {{pvNameSize}}px; letter-spacing: 0.06em; line-height: 1.12; color: #3f3c37">{{pvName}}</span>
<span aria-label="{{pvDates}}" style="font-family: 'EB Garamond', Georgia, serif; font-size: 19px; letter-spacing: 0.03em; color: #4d4943; white-space: nowrap"><span style="opacity: {{pvD1Op}}">{{pvD1}}</span> – <span style="opacity: {{pvD2Op}}">{{pvD2}}</span></span>
<span style="display: {{pvQuoteDisp}}; font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 19px; line-height: 1.35; color: #4d4943">{{pvQuote}}</span>
</div>
</div>
