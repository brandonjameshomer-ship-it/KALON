<sc-if value="{{wIs_details}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 12px; background: #f4efe4; border: 1px solid #e0d6c2">
<span aria-live="polite" style="font-size: 17px; line-height: 1.4; color: #3d3a34">{{prefCount}}</span>
<button type="button" onClick="{{prefClear}}" style="display: {{prefClearDisp}}; flex: none; height: 40px; padding: 0 14px; align-items: center; border: 2px solid #cfc9bd; border-radius: 10px; background: #ffffff; color: #1e1c19; font-size: 15px; cursor: pointer">Clear all</button>
</div>
<div style="display: flex; flex-direction: column; border: 2px solid #e0d9cc; border-radius: 14px; background: #ffffff; overflow: hidden">
<!--@pref-group {"key": "types", "title": "Type of headstone", "list": "prefTypes", "item": "zqt", "lead": "<svg viewBox=\"0 0 80 50\" width=\"40\" height=\"25\" aria-hidden=\"true\"><path d=\"M4 44 H76\" style=\"fill: none; stroke: #9d968a; stroke-width: 1.5; stroke-linecap: round\"></path><path d=\"{{zqt.icon}}\" style=\"fill: {{zqt.fill}}\"></path></svg>", "first": true}-->
<!--@pref-group {"key": "shapes", "title": "Shape", "list": "prefShapes", "item": "zqs", "lead": "<svg viewBox=\"-1 -1 38 26\" width=\"30\" height=\"20\" aria-hidden=\"true\"><path d=\"{{zqs.d}}\" style=\"fill: {{zqs.fill}}\"></path></svg>"}-->
<!--@pref-group {"key": "mats", "title": "Granite color", "list": "prefMats", "item": "zqm", "lead": "<span style=\"width: 28px; height: 28px; flex: none; border-radius: 50%; background: {{zqm.swatch}}; box-shadow: 0 0 0 2px {{zqm.ring}}\"></span>"}-->
<!--@pref-group {"key": "carves", "title": "Lettering finish", "list": "prefCarves", "item": "zqc", "lead": "<span style=\"width: 14px; height: 14px; flex: none; border-radius: 50%; background: {{zqc.dot}}; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3)\"></span>"}-->
<!--@pref-group {"key": "fonts", "title": "Lettering style", "list": "prefFonts", "item": "zqf", "lead": "<span style=\"font-family: {{zqf.family}}; font-style: {{zqf.fstyle}}; font-size: 20px; line-height: 1\">Aa</span>"}-->

</div>
</div>
</sc-if>
