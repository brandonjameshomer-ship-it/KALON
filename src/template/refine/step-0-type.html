<sc-if value="{{gIs0}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{typeCards}}" as="tc" hint-placeholder-count="5">
<button type="button" onClick="{{tc.pick}}" aria-pressed="{{tc.pressed}}" style="display: flex; gap: 14px; align-items: center; padding: 12px 14px; border: 2px solid {{tc.bd}}; border-radius: 12px; background: {{tc.bg}}; text-align: left; cursor: pointer; color: #1e1c19">
<svg viewBox="0 0 80 50" width="72" height="45" aria-hidden="true" style="flex-shrink: 0"><path d="M4 44 H76" style="fill: none; stroke: #9d968a; stroke-width: 1.5; stroke-linecap: round"></path><path d="{{tc.icon}}" style="fill: {{tc.fill}}"></path></svg>
<span style="display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 17px; font-weight: 600">{{tc.label}}</span>
<span style="font-size: 14px; line-height: 1.4; color: #3d3a34">{{tc.desc}}</span>
<span style="font-size: 13px; color: #5d584f">{{tc.size}}</span>
</span>
</button>
</sc-for>
</div>
</sc-if>
