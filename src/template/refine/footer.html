<div style="padding: 14px 22px; border-top: 1px solid #dcd7cc; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600; color: {{gChkFg}}">{{gChk}}</span>
<div style="display: flex; gap: 10px; align-items: center">
<button type="button" onClick="{{gBack}}" style="visibility: {{gBackVis}}; height: 50px; padding: 0 18px; border: 2px solid #cfc9bd; border-radius: 12px; background: #ffffff; color: #1e1c19; font-size: 16px; font-weight: 500; cursor: pointer">Back</button>
<button type="button" onClick="{{gNext}}" style="flex-grow: 1; height: 50px; padding: 0 18px; border: 2px solid {{accent}}; border-radius: 12px; background: {{accent}}; color: #ffffff; font-size: 16px; font-weight: 600; cursor: pointer">{{gNextLabel}}</button>
</div>
</div>
