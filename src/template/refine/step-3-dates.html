<sc-if value="{{gIs3}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{fontCards}}" as="fo" hint-placeholder-count="5">
<button type="button" onClick="{{fo.pick}}" aria-pressed="{{fo.pressed}}" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; border: 2px solid {{fo.bd}}; border-radius: 12px; background: {{fo.bg}}; color: #1e1c19; text-align: left; cursor: pointer">
<span style="font-family: {{fo.f1}}; font-style: {{fo.s1}}; font-size: 24px; letter-spacing: {{fo.t1}}em; line-height: 1.15">{{fo.sample1}}</span>
<span style="font-family: {{fo.f2}}; font-style: {{fo.s2}}; font-size: 19px; line-height: 1.2">{{fo.sample2}}</span>
<span style="font-size: 14px; color: #3d3a34"><span style="font-weight: 600; color: #1e1c19">{{fo.label}}</span> · {{fo.desc}}</span>
</button>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px; padding-top: 14px; border-top: 1px solid #e4dfd5">
<!--@heading {"text": "Dates", "size": "large"}-->
<sc-for list="{{dateChips}}" as="dc" hint-placeholder-count="3">
<button type="button" onClick="{{dc.pick}}" aria-pressed="{{dc.pressed}}" style="min-height: 46px; padding: 8px 14px; border: 2px solid {{dc.bd}}; border-radius: 10px; background: {{dc.bg}}; color: #1e1c19; font-family: 'EB Garamond', Georgia, serif; font-size: 17px; text-align: left; cursor: pointer">{{dc.label}}</button>
</sc-for>
<span style="font-size: 14px; font-weight: 600; color: #3d3a34; padding-top: 6px">Words with the dates</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{dateWordChips}}" as="zdw2" hint-placeholder-count="6">
<button type="button" onClick="{{zdw2.pick}}" aria-pressed="{{zdw2.pressed}}" style="min-height: 40px; padding: 0 12px; border: 2px solid {{zdw2.bd}}; border-radius: 10px; background: {{zdw2.bg}}; color: #1e1c19; font-size: 14px; cursor: pointer">{{zdw2.label}}</button>
</sc-for>
</div>
<div style="display: {{dwCustomDisp}}; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #4a463f">Before the first date</span><input type="text" value="{{dwA}}" onChange="{{onDwA}}" placeholder="Born" style="height: 46px; box-sizing: border-box; padding: 0 12px; border: 2px solid #cfc9bd; border-radius: 10px; background: #ffffff; font-size: 16px; color: #1e1c19; width: 100%"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #4a463f">Before the second date</span><input type="text" value="{{dwB}}" onChange="{{onDwB}}" placeholder="Passed" style="height: 46px; box-sizing: border-box; padding: 0 12px; border: 2px solid #cfc9bd; border-radius: 10px; background: #ffffff; font-size: 16px; color: #1e1c19; width: 100%"></label>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px; padding-top: 14px; border-top: 1px solid #e4dfd5">
<!--@heading {"text": "Quotes on the stone", "size": "large"}-->
<p style="display: {{quoteHintDisp}}; margin: 0; font-size: 14px; line-height: 1.45; color: #3d3a34">{{quoteHint}}</p>
<sc-for list="{{quoteChips}}" as="qc" hint-placeholder-count="2">
<div class="hs-qrow" draggable="{{qc.drag}}" onDragStart="{{qc.onDragStart}}" onDragOver="{{qc.onDragOver}}" onDrop="{{qc.onDrop}}" onDragEnd="{{qc.onDragEnd}}" style="display: flex; align-items: stretch; gap: 6px">
<button type="button" onClick="{{qc.pick}}" aria-pressed="{{qc.pressed}}" style="flex-grow: 1; min-width: 0; min-height: 46px; padding: 8px 14px; border: 2px solid {{qc.bd}}; border-radius: 10px; background: {{qc.bg}}; color: #1e1c19; font-family: {{qc.family}}; font-style: {{qc.fstyle}}; font-size: 16px; line-height: 1.35; text-align: left; cursor: pointer">{{qc.label}}</button>
<div class="hs-qmove" style="display: {{qc.moveDisp}}; flex-direction: column; gap: 4px; flex: none">
<button type="button" onClick="{{qc.up}}" aria-label="{{qc.upLabel}}" title="{{qc.upLabel}}" style="flex: 1; width: 36px; min-height: 20px; border: 1px solid #d3cdc1; border-radius: 8px; background: #ffffff; color: #1e1c19; font-size: 14px; opacity: {{qc.upOp}}; cursor: pointer">↑</button>
<button type="button" onClick="{{qc.down}}" aria-label="{{qc.downLabel}}" title="{{qc.downLabel}}" style="flex: 1; width: 36px; min-height: 20px; border: 1px solid #d3cdc1; border-radius: 8px; background: #ffffff; color: #1e1c19; font-size: 14px; opacity: {{qc.downOp}}; cursor: pointer">↓</button>
</div>
</div>
</sc-for>
<sc-if value="{{hasRole}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{toggleRole}}" aria-pressed="{{roleChipPressed}}" style="min-height: 46px; padding: 8px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border: 2px solid {{roleChipBd}}; border-radius: 10px; background: {{roleChipBg}}; color: #1e1c19; text-align: left; cursor: pointer"><span style="font-family: 'EB Garamond', Georgia, serif; font-size: 18px">{{roleChipLabel}}</span><span style="font-size: 13px; color: #5d584f">Suggested from their story</span></button>
</sc-if>
</div>
</div>
</sc-if>
