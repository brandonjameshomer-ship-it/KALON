<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-size: 12px; color: #5d584f">{{selPosHead}}</span><span style="font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">{{selPosLabel}}</span></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<button type="button" onClick="{{nudgeL}}" aria-label="Move left a quarter inch" style="height: 36px; border: 1px solid #d3cdc1; border-radius: 8px; background: #ffffff; font-size: 15px; color: #1e1c19; cursor: pointer">←</button>
<button type="button" onClick="{{nudgeU}}" aria-label="Move up a quarter inch" style="height: 36px; border: 1px solid #d3cdc1; border-radius: 8px; background: #ffffff; font-size: 15px; color: #1e1c19; cursor: pointer">↑</button>
<button type="button" onClick="{{nudgeD}}" aria-label="Move down a quarter inch" style="height: 36px; border: 1px solid #d3cdc1; border-radius: 8px; background: #ffffff; font-size: 15px; color: #1e1c19; cursor: pointer">↓</button>
<button type="button" onClick="{{nudgeR}}" aria-label="Move right a quarter inch" style="height: 36px; border: 1px solid #d3cdc1; border-radius: 8px; background: #ffffff; font-size: 15px; color: #1e1c19; cursor: pointer">→</button>
<button type="button" onClick="{{centerH}}" aria-label="Center horizontally on the stone" style="height: 36px; border: 1px solid #d3cdc1; border-radius: 8px; background: #ffffff; font-size: 15px; color: #1e1c19; cursor: pointer; font-size: 11px">Center</button>
</div>
<button type="button" onClick="{{resetSel}}" style="display: {{resetSelDisp}}; align-items: center; align-self: flex-start; height: 32px; padding: 0 10px; border: 1px solid {{accent}}; border-radius: 8px; background: #ffffff; color: {{accent}}; font-size: 12px; font-weight: 600; cursor: pointer">Put it back where the layout had it</button>
<span style="font-size: 11px; line-height: 1.4; color: #5d584f">{{selPosHint}}</span>
