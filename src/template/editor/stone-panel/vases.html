<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{vaseKindChips}}" as="zevk" hint-placeholder-count="2">
<button type="button" onClick="{{zevk.pick}}" aria-pressed="{{zevk.pressed}}" style="min-height: 36px; padding: 4px 8px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid {{zevk.bd}}; border-radius: 10px; background: {{zevk.bg}}; color: #1e1c19; font-size: 12px; line-height: 1.2; cursor: pointer"><svg viewBox="-8 -19 16 20" width="14" height="18" aria-hidden="true" style="flex: none"><path d="{{zevk.icon}}" style="fill: {{zevk.fill}}"></path></svg><span>{{zevk.label}}</span></button>
</sc-for>
</div>
<div style="display: {{vaseOnDisp}}; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 600; color: #3d3a34">{{vaseSideTitle}}</span>
<!--@choice-chips {"list": "vaseSideChips", "item": "zevs", "size": "compact", "columns": 2, "count": 2, "radius": "10px"}-->
<div style="display: {{vaseLyDisp}}; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; color: #3d3a34">Side vases at the</span>
<!--@choice-chips {"list": "vaseLyChips", "item": "zevl", "size": "compact", "columns": 3, "count": 3, "radius": "10px"}-->
</div>
<div role="group" aria-label="Side vase height" style="display: {{vaseRiseDisp}}; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 8px; border: 1px solid #d8d1c4; border-radius: 8px; background: #ffffff">
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; color: #4a463f">Side vase height</span><span style="font-size: 13px; font-weight: 600; color: #1e1c19">{{vaseRiseLabel}}</span></span>
<span style="display: flex; gap: 6px; flex: none"><!--@step-button {"action": "vaseUp", "label": "Move the side vases up", "glyph": "↑", "size": "large"}--><!--@step-button {"action": "vaseDown", "label": "Move the side vases down", "glyph": "↓", "size": "large"}--></span>
</div>
<span style="font-size: 12px; font-weight: 600; color: #3d3a34">{{vaseFrontTitle}}</span>
<!--@choice-chips {"list": "vaseFrontChips", "item": "zevf", "size": "compact", "columns": 3, "count": 3, "radius": "10px"}-->
<div role="group" aria-label="Vase size" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 8px; border: 1px solid #d8d1c4; border-radius: 8px; background: #ffffff">
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13px; color: #4a463f">Vase size</span><span style="font-size: 15px; font-weight: 600; color: #1e1c19">{{vaseSizeLabel}}</span></span>
<span style="display: flex; gap: 6px; flex: none"><!--@step-button {"action": "vaseSmaller", "label": "Smaller vases", "glyph": "−", "size": "large"}--><!--@step-button {"action": "vaseLarger", "label": "Larger vases", "glyph": "+", "size": "large"}--></span>
</div>
</div>
