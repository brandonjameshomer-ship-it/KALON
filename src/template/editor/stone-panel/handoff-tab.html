<sc-if value="{{isTabHandoff}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px">
<section style="display: flex; flex-direction: column">
<!--@heading {"text": "Stone specification", "size": "compact", "margin": "0 0 6px"}-->
<sc-for list="{{specRows}}" as="sr" hint-placeholder-count="7">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #ebe7de; font-size: 13px">
<span style="color: #5d584f; flex-shrink: 0">{{sr.k}}</span>
<span style="text-align: right">{{sr.v}}</span>
</div>
</sc-for>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<!--@heading {"text": "Carving schedule", "size": "compact"}-->
<sc-for list="{{schedule}}" as="row" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid #dcd7cc; border-radius: 10px; background: #ffffff">
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; background: #f0b54a; color: #1e1c19; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{row.num}}</span>
<span style="font-size: 13px; font-weight: 600">{{row.title}}</span>
</div>
<div style="font-family: {{row.family}}; font-style: {{row.fstyle}}; font-size: 16px; line-height: 1.3; white-space: pre-line">{{row.content}}</div>
<sc-for list="{{row.lines}}" as="ln">
<div style="display: flex; gap: 8px; font-size: 12px; line-height: 1.4"><span style="width: 80px; flex-shrink: 0; color: #5d584f">{{ln.k}}</span><span>{{ln.v}}</span></div>
</sc-for>
</div>
</sc-for>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<!--@heading {"text": "Vector file", "size": "compact"}-->
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" onClick="{{copySvg}}" style="height: 44px; border: 1px solid {{accent}}; border-radius: 8px; background: {{accent}}; color: #ffffff; font-size: 13px; font-weight: 600; cursor: pointer">Copy SVG</button>
<button type="button" onClick="{{downloadSvg}}" style="height: 44px; border: 1px solid #cfc9bd; border-radius: 8px; background: #ffffff; color: #1e1c19; font-size: 13px; font-weight: 600; cursor: pointer">Download .svg</button>
</div>
<span aria-live="polite" style="min-height: 16px; font-size: 12px; color: #3d3a34">{{status}}</span>
<textarea value="{{svgCode}}" onChange="{{noop}}" readonly="{{yes}}" spellcheck="false" aria-label="SVG code for the carver" style="height: 200px; box-sizing: border-box; padding: 10px; resize: vertical; border: 1px solid #cfc9bd; border-radius: 8px; background: #ffffff; color: #1e1c19; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; line-height: 1.5; white-space: pre"></textarea>
<p style="margin: 0; font-size: 12px; line-height: 1.5; color: #5d584f">A 1:1 file in inches with one group per layer, tagged with its number, method, typeface and size. Photos are embedded. Ask the carver to convert text to outlines before cutting the stencil.</p>
</section>
</div>
</sc-if>
