<sc-for list="{{o.layers}}" as="l">
<sc-if value="{{l.isBorder}}" hint-placeholder-val="{{false}}">
<svg viewBox="{{l.vb}}" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none">
<g style="filter: url(#{{l.fid}}); opacity: {{l.op}}">
<path d="{{l.stoneD}}" transform="{{l.btf1}}" style="fill: none; stroke: {{l.color}}; stroke-width: {{l.bw}}; stroke-dasharray: {{l.dash}}; stroke-linecap: round"></path>
<path d="{{l.stoneD}}" transform="{{l.btf2}}" style="display: {{l.d2}}; fill: none; stroke: {{l.color}}; stroke-width: {{l.bw}}; stroke-linecap: round"></path>
</g>
<path d="{{l.stoneD}}" transform="{{l.btfS2}}" style="display: {{l.bSelDisp}}; fill: none; stroke: #22d3ee; stroke-width: 1.5; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke"></path>
<path d="{{l.stoneD}}" transform="{{l.btfS1}}" style="display: {{l.bSelDisp}}; fill: none; stroke: #22d3ee; stroke-width: 1.5; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke"></path>
</svg>
</sc-if>
<sc-if value="{{l.isSymbol}}" hint-placeholder-val="{{false}}">
<svg viewBox="{{l.vb}}" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none">
<g style="filter: url(#{{l.fid}}); opacity: {{l.op}}">
<path d="{{l.symD}}" transform="{{l.symTf}}" style="fill: {{l.symFill}}; stroke: {{l.symStroke}}; stroke-width: {{l.symSw}}; fill-rule: evenodd; stroke-linecap: round; stroke-linejoin: round"></path>
</g>
</svg>
</sc-if>
<sc-if value="{{l.isText}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: {{l.tx}}px; top: {{l.ty}}px; transform: translate(-50%, -50%); padding-left: {{l.ls}}px; white-space: pre; text-align: center; font-family: {{l.family}}; font-style: {{l.fstyle}}; font-size: {{l.fs}}px; line-height: {{l.lhpx}}px; letter-spacing: {{l.ls}}px; color: {{l.color}}; text-shadow: {{l.shadow}}; opacity: {{l.op}}; background-image: {{l.gloss}}; background-size: 100% {{l.lhpx}}px; background-repeat: repeat-y; -webkit-background-clip: {{l.clip}}; background-clip: {{l.clip}}; -webkit-text-fill-color: {{l.fill}}; pointer-events: none"><sc-for list="{{l.segs}}" as="zsg"><span style="outline: {{zsg.ol}}; outline-offset: 3px; border-radius: 4px"><span style="visibility: {{zsg.vis}}">{{zsg.t}}</span></span></sc-for></div>
</sc-if>
<sc-if value="{{l.isPhoto}}" hint-placeholder-val="{{false}}">
<svg viewBox="{{l.vb}}" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; mix-blend-mode: {{l.blend}}">
<defs><filter id="{{l.fxId}}-bw" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"></feColorMatrix><feComponentTransfer><feFuncR type="linear" slope="1.1" intercept="-0.04"></feFuncR><feFuncG type="linear" slope="1.1" intercept="-0.04"></feFuncG><feFuncB type="linear" slope="1.1" intercept="-0.04"></feFuncB></feComponentTransfer></filter><filter id="{{l.fxId}}-et" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feColorMatrix in="SourceGraphic" type="saturate" values="0" result="g"></feColorMatrix><feComponentTransfer in="g" result="c"><feFuncR type="gamma" amplitude="1.15" exponent="1.25" offset="-0.06"></feFuncR><feFuncG type="gamma" amplitude="1.15" exponent="1.25" offset="-0.06"></feFuncG><feFuncB type="gamma" amplitude="1.15" exponent="1.25" offset="-0.06"></feFuncB></feComponentTransfer><feTurbulence type="fractalNoise" baseFrequency="{{l.fxFq}}" numOctaves="1" seed="7" result="n"></feTurbulence><feColorMatrix in="n" type="matrix" values="-2.2 0 0 0 1.6  -2.2 0 0 0 1.6  -2.2 0 0 0 1.6  0 0 0 0 1" result="ni"></feColorMatrix><feComposite in="c" in2="ni" operator="arithmetic" k1="0" k2="1" k3="1" k4="-0.5" result="d"></feComposite><feComponentTransfer in="d" result="t"><feFuncR type="discrete" tableValues="{{l.fxTv}}"></feFuncR><feFuncG type="discrete" tableValues="{{l.fxTv}}"></feFuncG><feFuncB type="discrete" tableValues="{{l.fxTv}}"></feFuncB></feComponentTransfer><feColorMatrix in="t" type="luminanceToAlpha" result="m"></feColorMatrix><feFlood flood-color="{{l.fxCol}}" result="f"></feFlood><feComposite in="f" in2="m" operator="in"></feComposite></filter><filter id="{{l.fxId}}-sk" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feColorMatrix in="SourceGraphic" type="saturate" values="0" result="g"></feColorMatrix><feComponentTransfer in="g" result="inv"><feFuncR type="table" tableValues="1 0"></feFuncR><feFuncG type="table" tableValues="1 0"></feFuncG><feFuncB type="table" tableValues="1 0"></feFuncB></feComponentTransfer><feGaussianBlur in="inv" stdDeviation="{{l.fxSb}}" result="ib"></feGaussianBlur><feBlend in="ib" in2="g" mode="color-dodge" result="sk"></feBlend><feComponentTransfer in="sk" result="ln"><feFuncR type="linear" slope="-2.2" intercept="2.05"></feFuncR><feFuncG type="linear" slope="-2.2" intercept="2.05"></feFuncG><feFuncB type="linear" slope="-2.2" intercept="2.05"></feFuncB></feComponentTransfer><feColorMatrix in="ln" type="luminanceToAlpha" result="m"></feColorMatrix><feFlood flood-color="{{l.fxCol}}" result="f"></feFlood><feComposite in="f" in2="m" operator="in"></feComposite></filter><filter id="{{l.fxId}}-rl" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feColorMatrix in="SourceGraphic" type="saturate" values="0" result="g"></feColorMatrix><feGaussianBlur in="g" stdDeviation="{{l.fxRb}}" result="gb"></feGaussianBlur><feComponentTransfer in="gb" result="gp"><feFuncR type="discrete" tableValues="0 0.2 0.4 0.6 0.8 1"></feFuncR><feFuncG type="discrete" tableValues="0 0.2 0.4 0.6 0.8 1"></feFuncG><feFuncB type="discrete" tableValues="0 0.2 0.4 0.6 0.8 1"></feFuncB></feComponentTransfer><feGaussianBlur in="gp" stdDeviation="{{l.fxRb}}" result="gs"></feGaussianBlur><feColorMatrix in="gs" type="luminanceToAlpha" result="h"></feColorMatrix><feDiffuseLighting in="h" surfaceScale="{{l.fxSs}}" diffuseConstant="1.15" lighting-color="{{l.fxLc}}" result="lit"><feDistantLight azimuth="225" elevation="42"></feDistantLight></feDiffuseLighting><feComposite in="lit" in2="SourceGraphic" operator="in"></feComposite></filter><clipPath id="{{l.clipId}}"><rect x="{{l.px0}}" y="{{l.py0}}" width="{{l.pw}}" height="{{l.ph}}" rx="{{l.rx}}" ry="{{l.ry}}"></rect></clipPath></defs>
<image href="{{l.img}}" x="{{l.px0}}" y="{{l.py0}}" width="{{l.pw}}" height="{{l.ph}}" preserveAspectRatio="xMidYMid slice" style="display: {{l.imgDisp}}; clip-path: url(#{{l.clipId}}); filter: url(#{{l.imgF}}); opacity: {{l.pop}}"></image>
<rect x="{{l.px0}}" y="{{l.py0}}" width="{{l.pw}}" height="{{l.ph}}" rx="{{l.rx}}" ry="{{l.ry}}" style="display: {{l.frameDisp}}; fill: none; stroke: #b08d57; stroke-width: {{l.frameW}}"></rect>
<g style="display: {{l.resvMatteDisp}}">
<filter id="{{l.resvFx}}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="{{l.resvBlur}}"></feGaussianBlur></filter>
<rect x="{{l.px0}}" y="{{l.py0}}" width="{{l.pw}}" height="{{l.ph}}" rx="{{l.rx}}" ry="{{l.ry}}" style="fill: {{l.resvMatte}}; opacity: 0.85; filter: url(#{{l.resvFx}})"></rect>
<path d="{{l.resvSilD}}" style="fill: {{l.resvSil}}; opacity: 0.55; filter: url(#{{l.resvFx}})"></path>
</g>
<text x="{{l.resvLx}}" y="{{l.resvLy}}" text-anchor="middle" dominant-baseline="middle" style="display: {{l.resvDisp}}; font-family: 'Instrument Sans', sans-serif; font-size: {{l.resvFs}}px; fill: rgba(225, 228, 231, 0.85)">{{l.resvLabel}}</text>
</svg>
</sc-if>
<svg viewBox="{{l.vb}}" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none">
<path d="{{l.rulerD}}" style="display: {{l.rulerDisp}}; fill: none; stroke: #7d766b; stroke-width: 1; vector-effect: non-scaling-stroke"></path>
<path d="{{l.gapD}}" style="display: {{l.gapDisp}}; fill: none; stroke: #a1998c; stroke-width: 1; vector-effect: non-scaling-stroke"></path>
<rect x="{{l.wx}}" y="{{l.wy}}" width="{{l.ww}}" height="{{l.wh}}" rx="{{l.wRx}}" style="display: {{l.warnDisp}}; fill: {{l.warnFill}}; stroke: {{l.warnCol}}; stroke-width: 1.5; stroke-dasharray: {{l.warnDash}}; vector-effect: non-scaling-stroke"></rect>
<rect x="{{l.zx}}" y="{{l.zy}}" width="{{l.zw}}" height="{{l.zh}}" rx="{{l.zRx}}" style="display: {{l.zDisp}}; fill: {{l.zFill}}; stroke: {{l.zStroke}}; stroke-width: {{l.zSw}}; stroke-dasharray: {{l.zDash}}; vector-effect: non-scaling-stroke"></rect>
<rect x="{{l.z2x}}" y="{{l.z2y}}" width="{{l.z2w}}" height="{{l.z2h}}" rx="{{l.zRx}}" style="display: {{l.z2Disp}}; fill: {{l.z2Fill}}; stroke: {{l.z2Stroke}}; stroke-width: {{l.z2Sw}}; stroke-dasharray: {{l.z2Dash}}; vector-effect: non-scaling-stroke"></rect>
<rect x="{{l.hx}}" y="{{l.hy}}" width="{{l.hw}}" height="{{l.hh}}" style="display: {{l.selDisp}}; fill: none; stroke: #22d3ee; stroke-width: 1.5; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke"></rect>
</svg>
<div aria-hidden="true" style="display: {{l.rulerDivDisp}}; position: absolute; left: {{l.rulerLx}}px; top: {{l.rulerLy}}px; transform: translate(-100%, -50%); font-family: 'Instrument Sans', sans-serif; font-size: {{l.mFs}}px; color: #3d3a34; white-space: nowrap; pointer-events: none">{{l.rulerLabel}}</div>
<div aria-hidden="true" style="display: {{l.gapDivDisp}}; position: absolute; left: {{l.gapLx}}px; top: {{l.gapLy}}px; transform: translate(0, -50%); font-family: 'Instrument Sans', sans-serif; font-size: {{l.mFs}}px; color: #5d584f; white-space: nowrap; pointer-events: none">{{l.gapLabel}}</div>
<div aria-hidden="true" style="display: {{l.zLabDisp}}; position: absolute; left: {{l.zLx}}px; top: {{l.zLy}}px; transform: {{l.zLabTf}}; padding: 2px 8px; border-radius: 6px; background: rgba(12, 22, 26, 0.88); font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: {{l.mFs}}px; color: #67e8f9; white-space: nowrap; pointer-events: none; z-index: 3">{{l.zLabel}}</div>
<div aria-hidden="true" style="display: {{l.z2LabDisp}}; position: absolute; left: {{l.z2Lx}}px; top: {{l.z2Ly}}px; transform: translateX(-50%); padding: 2px 8px; border-radius: 6px; background: rgba(12, 22, 26, 0.88); font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: {{l.mFs}}px; color: #67e8f9; white-space: nowrap; pointer-events: none; z-index: 3">{{l.z2Label}}</div>
<div aria-hidden="true" style="display: {{l.selDivDisp}}; position: absolute; left: {{l.labLx}}px; top: {{l.labLy}}px; transform: translate(0, -100%); font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: {{l.mFs}}px; color: #67e8f9; text-shadow: 0 0 3px rgba(20, 18, 15, 0.95), 0 0 1px #000000; white-space: nowrap; pointer-events: none">{{l.selLabel}}</div>
<div aria-hidden="true" style="display: {{l.badgeDisp}}; position: absolute; left: {{l.bgLx}}px; top: {{l.bgLy}}px; width: {{l.bgD}}px; height: {{l.bgD}}px; box-sizing: border-box; transform: translate(-50%, -50%); align-items: center; justify-content: center; border-radius: 50%; background: #f0b54a; border: 1px solid #1e1c19; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: {{l.mFs}}px; color: #1e1c19; pointer-events: none">{{l.num}}</div>
<svg viewBox="{{l.vb}}" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none">
<rect x="{{l.hx}}" y="{{l.hy}}" width="{{l.hw}}" height="{{l.hh}}" onPointerDown="{{l.onDown}}" onPointerMove="{{l.onMove}}" onPointerUp="{{l.onUp}}" onPointerCancel="{{l.onUp}}" style="display: {{l.hitDisp}}; fill: transparent; pointer-events: all; cursor: {{l.cursor}}; touch-action: none"></rect>
</svg>
</sc-for>
