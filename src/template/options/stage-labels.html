<div style="position: absolute; left: 40px; top: 84px; width: {{hdrW}}px; display: flex; flex-direction: column; gap: 6px; opacity: {{hdrOp}}; transform: translateY({{hdrY}}px); transition: opacity .4s ease, transform .5s ease; pointer-events: none">
<h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 38px; font-weight: 600; line-height: 1.05">{{optHeadline}}</h1>
<p style="margin: 0; font-size: 16px; color: #3d3a34">{{headerSub}}</p>
</div>

<button type="button" onClick="{{toAll}}" style="position: absolute; left: 40px; top: 84px; z-index: 6; height: 48px; padding: 0 20px 0 14px; display: flex; align-items: center; gap: 8px; border: 1px solid #cfc9bd; border-radius: 24px; background: #fbfaf7; color: #1e1c19; font-size: 16px; font-weight: 500; cursor: pointer; box-shadow: 0 1px 3px rgba(30, 28, 25, 0.12); opacity: {{capOp}}; visibility: {{capVis}}; transition: opacity .45s ease {{capDelay}}, visibility 0s linear {{capVisDelay}}">
<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5 L8 12 L15 19" style="fill: none; stroke: #3d3a34; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"></path></svg>
<span>Back to all three designs</span>
</button>
<div style="position: absolute; left: 40px; bottom: 30px; z-index: 5; display: flex; flex-direction: column; gap: 4px; opacity: {{capOp}}; transition: opacity .45s ease {{capDelay}}; pointer-events: none">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #4a463f">{{capEyebrow}}</span>
<span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1">{{capTitle}}</span>
<span style="font-size: 15px; color: #3d3a34">{{capSpec}}</span>
</div>
