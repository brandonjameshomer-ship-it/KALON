server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/html text/css application/javascript;
  gzip_min_length 1024;

  # The page itself always revalidates so a rebuild shows up right away.
  location = /index.html { add_header Cache-Control "no-cache"; }
  # Fonts and the runtime rarely change.
  location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location = /support.js { add_header Cache-Control "public, max-age=86400"; }

  location / { try_files $uri $uri/ /index.html; }
}
